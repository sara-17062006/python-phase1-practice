<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🐍 String Placement Practice</title><style>:root{--bg:#080d19;--panel:#11192c;--panel2:#0b1324;--text:#edf2ff;--muted:#93a4c3;--accent:#6f7ff5;--ok:#19b77d;--bad:#e05c70;--border:#293b60}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#080d19,#111a31);color:var(--text);font-family:Inter,system-ui,Arial,sans-serif}header{padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:rgba(8,13,25,.96);z-index:5}h1{margin:0 0 5px;font-size:23px}.sub{color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:300px 1fr;min-height:calc(100vh - 78px)}aside{padding:14px;border-right:1px solid var(--border);height:calc(100vh - 78px);position:sticky;top:78px;overflow:auto}.search{width:100%;padding:10px;border:1px solid var(--border);background:#091224;color:var(--text);border-radius:9px}.progress{margin:10px 0;padding:11px;background:#091224;border:1px solid var(--border);border-radius:10px}.bar{height:7px;background:#202d49;border-radius:9px;margin-top:7px;overflow:hidden}.fill{height:100%;background:var(--accent);width:0}.list button{width:100%;padding:8px;text-align:left;background:transparent;color:var(--muted);border:1px solid transparent;border-radius:8px;cursor:pointer;margin:2px 0}.list button.active{background:#1a2850;color:#fff;border-color:#4053a0}.list button.done{color:#72e7b7}main{padding:20px;max-width:1100px;width:100%;margin:auto}.card{background:rgba(17,25,44,.96);border:1px solid var(--border);border-radius:15px;padding:18px}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#202d50;color:#bcc6ff;font-size:11px}h2{margin:9px 0;font-size:22px}.question{line-height:1.65;color:#dce5f7}.section{font-weight:800;font-size:13px;margin:15px 0 7px}pre,.terminal{background:#060b14;border:1px solid #273656;border-radius:9px;padding:12px;white-space:pre-wrap;overflow:auto}.editor{width:100%;min-height:310px;resize:vertical;background:#060b14;color:#eef4ff;border:1px solid #33496f;border-radius:10px;padding:13px;font:14px/1.55 Consolas,monospace}.inputbox{width:100%;min-height:72px;resize:vertical;background:#060b14;color:#eef4ff;border:1px solid #33496f;border-radius:10px;padding:12px;font:13px/1.5 Consolas,monospace}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button.action{border:0;border-radius:9px;padding:10px 13px;background:#29385f;color:#fff;cursor:pointer;font-weight:800}button.primary{background:#6576f2}button.good{background:var(--ok)}button.danger{background:#7b3042}.status{margin-top:10px;padding:11px;border-radius:9px;background:#091224;color:var(--muted);white-space:pre-wrap}.status.ok{border:1px solid #1f7659;color:#86efc6}.status.bad{border:1px solid #783545;color:#ff9aa8}.small{color:var(--muted);font-size:12px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chip{padding:4px 8px;border-radius:999px;background:#182744;border:1px solid #2a4169;color:#c9d7ee;font-size:10px}.back{display:inline-block;color:#aebcff;text-decoration:none;margin-bottom:10px}.hidden-note{padding:11px;border:1px dashed #4b5d82;border-radius:9px;background:#0b1529;color:#b9c8df;font-size:12px;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{padding:10px;background:#0b1529;border:1px solid #293d63;border-radius:9px}.stat b{display:block;font-size:20px}.stat span{font-size:10px;color:var(--muted)}@media(max-width:850px){.layout{grid-template-columns:1fr}aside{position:relative;top:0;height:auto;max-height:310px;border-right:0;border-bottom:1px solid var(--border)}main{padding:12px}.stats{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>🧵 Python String Placement Practice</h1><div class="sub">Video-derived String Programs + complete placement-level String practice • hidden test judging</div></header><div class="layout"><aside><a class="back" href="/">← Back to Python Placement Mastery</a><input id="search" class="search" placeholder="Search string problem..."><div class="progress"><b id="progressText">0 / 66 completed</b><div class="bar"><div id="fill" class="fill"></div></div></div><div class="list" id="list"></div></aside><main><div class="card" id="app"></div></main></div><script>
const P=[
{id:1,t:'String Basics',title:'Print the length of a string',q:'Read a string and print its length.',inp:'Hello World',out:'11',oracle:s=>String(s.length)},
{id:2,t:'String Basics',title:'Print every character',q:'Read a string and print every character on a separate line.',inp:'Python',out:'P\\ny\\nt\\nh\\no\\nn',oracle:s=>[...s].join('\\n')},
{id:3,t:'Indexing',title:'First and last character',q:'Print the first character and the last character separated by a space. Assume the string is non-empty.',inp:'Placement',out:'P t',oracle:s=>s[0]+' '+s[s.length-1]},
{id:4,t:'Slicing',title:'Print a substring',q:'Given a string and two indices L R, print the substring from L to R-1.',inp:'Programming\\n3 9',out:'grammi',oracle:s=>{let[a,b]=s.split(/\\s+/);let l=+b?.[0];return a.slice(l,+(s.match(/\\d+\\s+(\\d+)/)||[])[1])}},
{id:5,t:'Counting',title:'Count a given character',q:'Count how many times the given character occurs in the string.',inp:'banana\\na',out:'3',oracle:s=>{let[a,c]=s.split('\\n');return String([...a].filter(x=>x===c.trim()).length)}},
{id:6,t:'Search',title:'Find whether a character exists',q:'Print YES if the given character occurs in the string, otherwise print NO.',inp:'computer\\nz',out:'NO',oracle:s=>{let[a,c]=s.split('\\n');return a.includes(c.trim())?'YES':'NO'}},
{id:7,t:'Case',title:'Convert to uppercase',q:'Convert the complete string to uppercase and print it.',inp:'PyThOn Placement',out:'PYTHON PLACEMENT',oracle:s=>s.toUpperCase()},
{id:8,t:'Case',title:'Convert to lowercase',q:'Convert the complete string to lowercase and print it.',inp:'PyThOn Placement',out:'python placement',oracle:s=>s.toLowerCase()},
{id:9,t:'Case',title:'Toggle the case of every character',q:'Uppercase letters become lowercase and lowercase letters become uppercase. Other characters stay unchanged.',inp:'PyThOn 2026!',out:'pYtHoN 2026!',oracle:s=>[...s].map(c=>c===c.toUpperCase()&&c!==c.toLowerCase()?c.toLowerCase():c===c.toLowerCase()&&c!==c.toUpperCase()?c.toUpperCase():c).join('')},
{id:10,t:'Validation',title:'Count alphabets, digits and spaces',q:'Print three counts: alphabets, digits, spaces.',inp:'A1 b2 C3!',out:'3 3 1',oracle:s=>{let a=0,d=0,sp=0;for(const c of s){if(/[A-Za-z]/.test(c))a++;else if(/[0-9]/.test(c))d++;else if(c===' ')sp++}return `${a} ${d} ${sp}`}},
{id:11,t:'Character Programs',title:'Count uppercase and lowercase',q:'Print uppercase count followed by lowercase count.',inp:'PyThOnIsFUN',out:'5 6',oracle:s=>{let u=0,l=0;for(const c of s){if(/[A-Z]/.test(c))u++;if(/[a-z]/.test(c))l++}return `${u} ${l}`}},
{id:12,t:'Character Programs',title:'Count digits',q:'Count and print the number of digit characters in the string.',inp:'A12B3x9',out:'4',oracle:s=>String((s.match(/\\d/g)||[]).length)},
{id:13,t:'Character Programs',title:'Print only uppercase characters',q:'Create and print a new string containing only uppercase alphabetic characters, in original order.',inp:'PyTHon IS FUN!',out:'THISFUN',oracle:s=>[...s].filter(c=>/[A-Z]/.test(c)).join('')},
{id:14,t:'Character Programs',title:'Print only digits',q:'Create and print a new string containing only digit characters.',inp:'A1b20C7',out:'1207',oracle:s=>[...s].filter(c=>/\\d/.test(c)).join('')},
{id:15,t:'Character Programs',title:'Digits first, then characters',q:'Print all digits first followed by all non-digit characters, preserving order inside each group.',inp:'a1B2c3!',out:'123aBc!',oracle:s=>[...s].filter(c=>/\\d/.test(c)).join('')+[...s].filter(c=>!/\\d/.test(c)).join('')},
{id:16,t:'Cleaning',title:'Remove all spaces',q:'Remove every space from the string and print the result.',inp:'Python is fun',out:'Pythonisfun',oracle:s=>s.replaceAll(' ','')},
{id:17,t:'Cleaning',title:'Remove a given character',q:'Remove every occurrence of the given character from the string.',inp:'programming\\nm',out:'prograing',oracle:s=>{let[a,c]=s.split('\\n');return [...a].filter(x=>x!==c.trim()).join('')}},
{id:18,t:'Reverse',title:'Reverse a string',q:'Print the string in reverse order.',inp:'placement',out:'tnemecalp',oracle:s=>[...s].reverse().join('')},
{id:19,t:'Palindrome',title:'Check palindrome',q:'Print YES if the string reads the same forward and backward; otherwise NO. Comparison is case-sensitive.',inp:'madam',out:'YES',oracle:s=>s===s.split('').reverse().join('')?'YES':'NO'},
{id:20,t:'Palindrome',title:'Palindrome ignoring case',q:'Check whether the string is a palindrome after converting letters to one case.',inp:'Level',out:'YES',oracle:s=>{let x=s.toLowerCase();return x===x.split('').reverse().join('')?'YES':'NO'}},
{id:21,t:'Encoding',title:'Shift every alphabet by one',q:'Replace each alphabetic character by the next alphabet letter. z becomes a and Z becomes A. Non-letters stay unchanged.',inp:'Abz Z!',out:'Bca A!',oracle:s=>[...s].map(c=>{if(c>='a'&&c<='z')return String.fromCharCode(c.charCodeAt(0)===122?97:c.charCodeAt(0)+1);if(c>='A'&&c<='Z')return String.fromCharCode(c.charCodeAt(0)===90?65:c.charCodeAt(0)+1);return c}).join('')},
{id:22,t:'Word Programs',title:'Print all words',q:'Read a line and print each word on a separate line.',inp:'I love Python',out:'I\\nlove\\nPython',oracle:s=>s.trim().split(/\\s+/).join('\\n')},
{id:23,t:'Word Programs',title:'Print words starting with a character',q:'Print every word that starts with the given character, one per line.',inp:'Red Rose Blue Rabbit\\nR',out:'Red\\nRose\\nRabbit',oracle:s=>{let[a,c]=s.split('\\n');return a.trim().split(/\\s+/).filter(w=>w.startsWith(c.trim())).join('\\n')}},
{id:24,t:'Word Programs',title:'Print words ending with a character',q:'Print every word that ends with the given character, one per line.',inp:'GOOD RED SEED ROAD\\nD',out:'GOOD\\nRED\\nROAD',oracle:s=>{let[a,c]=s.split('\\n');return a.trim().split(/\\s+/).filter(w=>w.endsWith(c.trim())).join('\\n')}},
{id:25,t:'Word Programs',title:'Print words containing a character',q:'Print every word containing the given character, one per line.',inp:'APPLE ORANGE PEAR BANANA\\nN',out:'ORANGE\\nBANANA',oracle:s=>{let[a,c]=s.split('\\n');return a.trim().split(/\\s+/).filter(w=>w.includes(c.trim())).join('\\n')}},
{id:26,t:'Word Programs',title:'Find a word',q:'Print FOUND if the target word occurs as a complete word in the line; otherwise print NOT FOUND.',inp:'I love Python coding\\nPython',out:'FOUND',oracle:s=>{let[a,w]=s.split('\\n');return a.trim().split(/\\s+/).includes(w.trim())?'FOUND':'NOT FOUND'}},
{id:27,t:'Word Programs',title:'Count words',q:'Count the words in a line. Words are separated by one or more spaces.',inp:'Python is easy to learn',out:'5',oracle:s=>String(s.trim().split(/\\s+/).filter(Boolean).length)},
{id:28,t:'Word Programs',title:'Find the longest word',q:'Print the longest word. If multiple words have the same maximum length, print the first one.',inp:'I study computer science',out:'computer',oracle:s=>s.trim().split(/\\s+/).reduce((a,b)=>b.length>a.length?b:a,'')},
{id:29,t:'Word Programs',title:'Replace a word',q:'Replace every occurrence of the target word with the replacement word and print the line.',inp:'A RED SEED RED\\nRED BLUE',out:'A BLUE SEED BLUE',oracle:s=>{let[a,b]=s.split('\\n');let[x,y]=b.trim().split(/\\s+/);return a.trim().split(/\\s+/).map(w=>w===x?y:w).join(' ')}},
{id:30,t:'Word Programs',title:'Delete a word',q:'Delete every complete occurrence of the target word and print the remaining words separated by one space.',inp:'A RED SEED RED\\nRED',out:'A SEED',oracle:s=>{let[a,w]=s.split('\\n');return a.trim().split(/\\s+/).filter(x=>x!==w.trim()).join(' ')}},
{id:31,t:'Word Programs',title:'Alternate uppercase/lowercase words',q:'Make word 1 uppercase, word 2 lowercase, word 3 uppercase, and so on.',inp:'Python IS Very FUN',out:'PYTHON is VERY fun',oracle:s=>s.trim().split(/\\s+/).map((w,i)=>i%2===0?w.toUpperCase():w.toLowerCase()).join(' ')},
{id:32,t:'Word Programs',title:'Capitalize every word',q:'Print the line with the first character of every word uppercase and the remaining characters lowercase.',inp:'pYTHON iS fUN',out:'Python Is Fun',oracle:s=>s.trim().split(/\\s+/).map(w=>w[0].toUpperCase()+w.slice(1).toLowerCase()).join(' ')},
{id:33,t:'Word Programs',title:'Swap first and last character of every word',q:'For every word, swap its first and last character. One-letter words remain unchanged.',inp:'CODE IS FUN',out:'EODC SI FNU',oracle:s=>s.trim().split(/\\s+/).map(w=>w.length<2?w:w.at(-1)+w.slice(1,-1)+w[0]).join(' ')},
{id:34,t:'Frequency',title:'Character frequency',q:'Print each distinct character and its frequency in first-appearance order, one pair per line as char count. Spaces are included.',inp:'banana',out:'b 1\\na 3\\nn 2',oracle:s=>{let m=new Map();for(const c of s)m.set(c,(m.get(c)||0)+1);return [...m].map(([c,n])=>`${c} ${n}`).join('\\n')}},
{id:35,t:'Frequency',title:'Most frequent character',q:'Print the most frequent character. If tied, print the one appearing first.',inp:'swiss',out:'s',oracle:s=>{let m={};for(const c of s)m[c]=(m[c]||0)+1;let best=s[0];for(const c of s)if(m[c]>m[best])best=c;return best}},
{id:36,t:'Frequency',title:'Remove duplicate characters',q:'Keep only the first occurrence of each character and print the resulting string.',inp:'programming',out:'progamin',oracle:s=>{let seen=new Set(),o='';for(const c of s)if(!seen.has(c)){seen.add(c);o+=c}return o}},
{id:37,t:'Frequency',title:'First non-repeating character',q:'Print the first character whose frequency is exactly one. Print -1 if none exists.',inp:'swiss',out:'w',oracle:s=>{let m={};for(const c of s)m[c]=(m[c]||0)+1;return [...s].find(c=>m[c]===1)||'-1'}},
{id:38,t:'Frequency',title:'Print duplicate characters',q:'Print each character that appears more than once, once, in first-appearance order.',inp:'programming',out:'r g m',oracle:s=>{let m={},o=[];for(const c of s)m[c]=(m[c]||0)+1;for(const c of s)if(m[c]>1&&!o.includes(c))o.push(c);return o.join(' ')}},
{id:39,t:'Comparison',title:'Check anagram',q:'Read two strings and print YES if they contain the same characters with the same frequencies; otherwise NO. Ignore spaces and case.',inp:'listen\\nSILENT',out:'YES',oracle:s=>{let[a,b]=s.split('\\n');const norm=x=>x.toLowerCase().replaceAll(' ','').split('').sort().join('');return norm(a)===norm(b)?'YES':'NO'}},
{id:40,t:'Comparison',title:'Check string rotation',q:'Read two strings and print YES if the second is a rotation of the first; otherwise NO.',inp:'ABCD\\nCDAB',out:'YES',oracle:s=>{let[a,b]=s.split('\\n');return a.length===b.length&&(a+a).includes(b)?'YES':'NO'}},
{id:41,t:'Substrings',title:'Count occurrences of a substring',q:'Count non-overlapping occurrences of the target substring.',inp:'aaaaa\\naa',out:'2',oracle:s=>{let[a,b]=s.split('\\n'),c=0,i=0;while((i=a.indexOf(b.trim(),i))!==-1){c++;i+=b.trim().length}return String(c)}},
{id:42,t:'Substrings',title:'Longest word length',q:'Print the length of the longest word in the line.',inp:'I love data structures',out:'10',oracle:s=>String(Math.max(...s.trim().split(/\\s+/).map(w=>w.length)))},
{id:43,t:'Compression',title:'Run-length encode a string',q:'For each consecutive group of equal characters, print character followed by its count. Example: aaabb -> a3b2.',inp:'aaabbc',out:'a3b2c1',oracle:s=>{if(!s)return '';let o='',c=s[0],n=0;for(const x of s){if(x===c)n++;else{o+=c+n;c=x;n=1}}return o+c+n}},
{id:44,t:'Validation',title:'Valid palindrome ignoring non-alphanumerics',q:'Check palindrome after removing every non-alphanumeric character and ignoring case.',inp:'A man, a plan, a canal: Panama!',out:'YES',oracle:s=>{let x=s.toLowerCase().replace(/[^a-z0-9]/g,'');return x===x.split('').reverse().join('')?'YES':'NO'}},
{id:45,t:'Words + Frequency',title:'Most frequent word',q:'Print the most frequent complete word. Comparison is case-insensitive. If tied, print the first occurring spelling.',inp:'Cat dog cat DOG cat',out:'Cat',oracle:s=>{let ws=s.trim().split(/\\s+/),m={};for(const w of ws){let k=w.toLowerCase();m[k]=(m[k]||0)+1}let best=ws[0];for(const w of ws)if(m[w.toLowerCase()]>m[best.toLowerCase()])best=w;return best}},
{id:46,t:'Words + Case',title:'Reverse every word',q:'Reverse the characters of every word but keep the word order unchanged.',inp:'I love Python',out:'I evol nohtyP',oracle:s=>s.trim().split(/\\s+/).map(w=>[...w].reverse().join('')).join(' ')},
{id:47,t:'Words + Filtering',title:'Print words with only alphabets',q:'Print words that contain alphabetic characters only, one per line.',inp:'hello hi2 world Python3 code',out:'hello\\nworld',oracle:s=>s.trim().split(/\\s+/).filter(w=>/^[A-Za-z]+$/.test(w)).join('\\n')},
{id:48,t:'Placement',title:'Second most frequent character',q:'Print the character with the second-highest frequency. If it does not exist, print -1. Ties are resolved by first appearance.',inp:'aabbcccdd',out:'a',oracle:s=>{let m={};for(const c of s)m[c]=(m[c]||0)+1;let vals=[...new Set(Object.values(m))].sort((a,b)=>b-a);if(vals.length<2)return '-1';let f=vals[1];return [...s].find(c=>m[c]===f)||'-1'}},
{id:49,t:'Placement',title:'Longest substring without repeating characters',q:'Print the length of the longest substring containing no repeated character.',inp:'abcabcbb',out:'3',oracle:s=>{let seen=new Map(),l=0,b=0;for(let r=0;r<s.length;r++){if(seen.has(s[r]))l=Math.max(l,seen.get(s[r])+1);seen.set(s[r],r);b=Math.max(b,r-l+1)}return String(b)}},
{id:50,t:'Character Programs',title:'Print ASCII value of every character',q:'Print each character followed by its ASCII value, one pair per line.',inp:'Ab3',out:'A 65\\nb 98\\n3 51',oracle:s=>[...s].map(c=>`${c} ${c.charCodeAt(0)}`).join('\\n')},
{id:51,t:'Character Programs',title:'Count vowels',q:'Count vowels in the string. Treat uppercase and lowercase vowels as the same.',inp:'Education',out:'5',oracle:s=>String([...s.toLowerCase()].filter(c=>'aeiou'.includes(c)).length)},
{id:52,t:'Character Programs',title:'Print only alphabetic characters',q:'Create and print a new string containing only alphabetic characters.',inp:'A1-b_C2!',out:'AbC',oracle:s=>[...s].filter(c=>/[A-Za-z]/.test(c)).join('')},
{id:53,t:'Word Programs',title:'Print length of every word',q:'Print the length of each word on a separate line.',inp:'I love Python',out:'1\\n4\\n6',oracle:s=>s.trim().split(/\\s+/).map(w=>String(w.length)).join('\\n')},
{id:54,t:'Word Programs',title:'Swap the first and last word',q:'Swap the first and last complete words of the line. Keep all middle words unchanged.',inp:'I love Python',out:'Python love I',oracle:s=>{let w=s.trim().split(/\\s+/);if(w.length<2)return w.join(' ');[w[0],w[w.length-1]]=[w[w.length-1],w[0]];return w.join(' ')}},
{id:55,t:'Placement',title:'Check if two strings are equal after removing spaces',q:'Read two strings and print YES if they become equal after removing spaces and ignoring case; otherwise NO.',inp:'Python Placement\\npythonplacement',out:'YES',oracle:s=>{let[a,b]=s.split('\\n');return a.replaceAll(' ','').toLowerCase()===b.replaceAll(' ','').toLowerCase()?'YES':'NO'}},
{id:56,t:'Placement',title:'Character with maximum ASCII value',q:'Print the character having the maximum ASCII value. If tied, print the first occurrence.',inp:'Az9!',out:'z',oracle:s=>{let b=s[0];for(const c of s)if(c.charCodeAt(0)>b.charCodeAt(0))b=c;return b}},
{id:57,t:'Placement',title:'Count words containing vowels',q:'Print the number of words that contain at least one vowel, case-insensitive.',inp:'sky apple dry ORANGE',out:'2',oracle:s=>String(s.trim().split(/\\s+/).filter(w=>/[aeiou]/i.test(w)).length)},
{id:58,t:'Placement',title:'Move all vowels to the front',q:'Print all vowels first, followed by all non-vowel characters, preserving order inside each group.',inp:'placement',out:'aee plcmnt',oracle:s=>[...s].filter(c=>/[aeiou]/i.test(c)).join('')+' '+[...s].filter(c=>!/[aeiou]/i.test(c)).join('')},
{id:59,t:'Placement',title:'Smallest word in a sentence',q:'Print the shortest word. If tied, print the first one.',inp:'I love coding',out:'I',oracle:s=>s.trim().split(/\\s+/).reduce((a,b)=>b.length<a.length?b:a)},
{id:60,t:'Placement',title:'Remove consecutive duplicate characters',q:'Compress consecutive repeated characters to one character. Example: aaabbcca -> abca.',inp:'aaabbcca',out:'abca',oracle:s=>{let o='';for(const c of s)if(!o||o.at(-1)!==c)o+=c;return o}},
{id:61,t:'Placement',title:'Check pangram',q:'Print YES if the string contains every English alphabet letter at least once, ignoring case; otherwise NO.',inp:'The quick brown fox jumps over the lazy dog',out:'YES',oracle:s=>{let x=new Set(s.toLowerCase().match(/[a-z]/g)||[]);return x.size===26?'YES':'NO'}},
{id:62,t:'Placement',title:'Common characters of two strings',q:'Print distinct characters that occur in both strings, in the order they first appear in the first string.',inp:'programming\\nalgorithm',out:'r o g a m i',oracle:s=>{let[a,b]=s.split('\\n'),set=new Set(b),seen=new Set(),o=[];for(const c of a)if(set.has(c)&&!seen.has(c)){seen.add(c);o.push(c)}return o.join(' ')}},
{id:63,t:'Placement',title:'Longest common prefix',q:'Read two strings and print their longest common prefix.',inp:'flower\\nflow',out:'flow',oracle:s=>{let[a,b]=s.split('\\n'),i=0;while(i<Math.min(a.length,b.length)&&a[i]===b[i])i++;return a.slice(0,i)}},
{id:64,t:'Placement',title:'Check if a string contains only unique characters',q:'Print YES if no character occurs more than once; otherwise NO.',inp:'python',out:'YES',oracle:s=>new Set(s).size===s.length?'YES':'NO'},
{id:65,t:'Placement',title:'Reverse only the letters',q:'Reverse alphabetic characters while keeping non-letter characters in their original positions.',inp:'a-bC-dEf!',out:'f-Ed-Cba!',oracle:s=>{let a=[...s],chars=a.filter(c=>/[A-Za-z]/.test(c)).reverse(),j=0;return a.map(c=>/[A-Za-z]/.test(c)?chars[j++]:c).join('')}},
{id:66,t:'Placement',title:'Check if one string is a subsequence of another',q:'Print YES if the first string can be obtained by deleting characters from the second without changing order; otherwise NO.',inp:'ace\\nabcde',out:'YES',oracle:s=>{let[a,b]=s.split('\\n'),i=0;for(const c of b)if(c===a[i])i++;return i===a.length?'YES':'NO'}}
];
const seeds=['Ab9 xY!','banana','A1 b2 C3','Python Placement','RED SEED ROAD','AaBbCc 123','programming','swiss','listen','ABCD','aaaaabbbcc','I love Python coding','Cat dog CAT DOG','aBcDeF 2026','level','Race car!'];
function hiddenInputs(p){let a=[];const base=seeds[(p.id*7)%seeds.length];for(let k=0;k<5;k++){let s=base;if(p.id===4)s=s+'\\n'+(k%3)+' '+Math.min(s.length,3+k);if([5,6,17].includes(p.id))s=s+'\\n'+['a','A','z',' ','g'][k];if([23,24,25].includes(p.id))s=s+'\\n'+['R','D','A','o','e'][k];if([26,29,30].includes(p.id))s=s+'\\n'+(p.id===29?(k%2?'RED BLUE':'DOG CAT'):(k%2?'Python':'RED'));if([50,55,62,63,66].includes(p.id)){if(p.id===50||p.id===66)s=(k%2?'ace':'cat')+'\\n'+(k%2?'abcde':'dog');if(p.id===55)s=(k%2?'Python Placement':'Hello World')+'\\n'+(k%2?'pythonplacement':'helloworld');if(p.id===62)s=(k%2?'programming':'abcxyz')+'\\n'+(k%2?'algorithm':'cdef');if(p.id===63)s=(k%2?'flower':'testing')+'\\n'+(k%2?'flow':'test')}if(p.id===39)s=(k%2?'listen':'evil')+'\\n'+(k%2?'silent':'vile');if(p.id===40)s=(k%2?'ABCD':'hello')+'\\n'+(k%2?'BCDA':'llohe');if(p.id===41)s=(k%2?'aaaaa':'banana')+'\\n'+(k%2?'aa':'an');a.push(s)}return a}
const KEY='string-practice-v1';let state=JSON.parse(localStorage.getItem(KEY)||'{}');let current=0;let pyodide=null;
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateProgress()}function updateProgress(){let n=Object.values(state).filter(x=>x==='pass').length;document.getElementById('progressText').textContent=`${n} / ${P.length} completed`;document.getElementById('fill').style.width=(n/P.length*100)+'%';document.querySelectorAll('#list button').forEach((b,i)=>b.classList.toggle('done',state[P[i].id]==='pass'))}
function renderList(filter=''){let box=document.getElementById('list');box.innerHTML='';P.forEach((p,i)=>{if(filter&&!`${p.id} ${p.title} ${p.t}`.toLowerCase().includes(filter.toLowerCase()))return;let b=document.createElement('button');b.textContent=`${p.id}. ${p.title}`;b.className=(i===current?'active ':'')+(state[p.id]==='pass'?'done':'');b.onclick=()=>{current=i;render();renderList(document.getElementById('search').value)};box.appendChild(b)})}
function sampleExpected(p){return p.oracle(p.inp)}function esc(x){return String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){let p=P[current];let code=state[p.id+'_code']||'';let app=document.getElementById('app');app.innerHTML=`<span class="badge">String ${p.id} / ${P.length} • ${p.t}</span><h2>${p.title}</h2><div class="chips"><span class="chip">Python</span><span class="chip">Hidden tests</span>${p.id<=33?'<span class="chip">Video practice</span>':''}</div><div class="question">${p.q}</div><div class="section">Sample Input</div><pre>${esc(p.inp)}</pre><div class="section">Sample Output</div><pre>${esc(p.out)}</pre><div class="section">Your Python Code</div><textarea id="code" class="editor" spellcheck="false" placeholder="# Write your solution here">${esc(code)}</textarea><div class="section">Custom Input (Run Code only)</div><textarea id="custom" class="inputbox">${esc(p.inp)}</textarea><div class="actions"><button class="action primary" id="run">▶ Run Code</button><button class="action good" id="submit">✓ Submit & Check Hidden Tests</button><button class="action" id="reset">Reset Code</button></div><div class="hidden-note"><b>🔒 Hidden test mode:</b> Submit runs 5 unseen generated test inputs in the Python compiler. Their inputs and expected outputs are not displayed. You only see the final pass/fail result and the number of hidden cases passed.</div><div id="status" class="status">${state[p.id]==='pass'?'✓ Completed — hidden tests passed previously.':'Ready.'}</div><div class="stats"><div class="stat"><b>5</b><span>hidden tests</span></div><div class="stat"><b>${state[p.id]==='pass'?'PASS':'—'}</b><span>current status</span></div><div class="stat"><b>${state[p.id+'_tries']||0}</b><span>submissions</span></div></div>`;document.getElementById('code').oninput=e=>{state[p.id+'_code']=e.target.value;save()};document.getElementById('run').onclick=()=>runCode(false);document.getElementById('submit').onclick=()=>runCode(true);document.getElementById('reset').onclick=()=>{state[p.id+'_code']='';save();render()}}
async function getPy(){if(pyodide)return pyodide;let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/pyodide/v0.27.2/full/pyodide.js';document.head.appendChild(s);await new Promise((res,rej)=>{s.onload=res;s.onerror=rej});pyodide=await loadPyodide();return pyodide}
async function execute(code,input){let py=await getPy();py.globals.set('USER_CODE',code);py.globals.set('TEST_INPUT',input);let r=await py.runPythonAsync(`import sys,io,contextlib,traceback\nout=io.StringIO(); err=io.StringIO(); sys.stdin=io.StringIO(TEST_INPUT+'\\n')\ntry:\n    with contextlib.redirect_stdout(out), contextlib.redirect_stderr(err):\n        exec(USER_CODE, {'__name__':'__main__'})\n    result=out.getvalue()\n    error=''\nexcept Exception:\n    result=out.getvalue(); error=traceback.format_exc()\n(result,error)`);return r.toJs({dict_converter:Object.fromEntries})}
function norm(s){return String(s??'').replace(/\\r/g,'').trim().replace(/[ \t]+$/gm,'')}
async function runCode(hidden){let p=P[current],code=document.getElementById('code').value;state[p.id+'_code']=code;state[p.id+'_tries']=(state[p.id+'_tries']||0)+1;save();let st=document.getElementById('status');st.className='status';st.textContent=hidden?'⏳ Running hidden tests...':'⏳ Running sample...';if(!code.trim()){st.className='status bad';st.textContent='Write your Python code first.';return}try{if(!hidden){let r=await execute(code,document.getElementById('custom').value);if(r[1]){st.className='status bad';st.textContent=r[1]}else{st.className='status '+(norm(r[0])===norm(sampleExpected(p))?'ok':'bad');st.textContent=`Output:\n${r[0]}\n\nExpected:\n${sampleExpected(p)}`}return}let tests=hiddenInputs(p),pass=0;for(const inp of tests){let r=await execute(code,inp);if(!r[1]&&norm(r[0])===norm(p.oracle(inp)))pass++;else break}if(pass===tests.length){state[p.id]='pass';save();st.className='status ok';st.textContent=`✓ ACCEPTED — ${pass}/${tests.length} hidden tests passed.\nYour solution satisfies the hidden cases for this problem.`}else{state[p.id]='fail';save();st.className='status bad';st.textContent=`✗ NOT ACCEPTED — ${pass}/${tests.length} hidden tests passed.\nYour code failed an unseen test. Fix the logic and submit again.`}renderList(document.getElementById('search').value)}catch(e){st.className='status bad';st.textContent='Compiler error: '+e.message}}
document.getElementById('search').oninput=e=>renderList(e.target.value);renderList();render();updateProgress();
</script></body></html>
